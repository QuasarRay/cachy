name: Build CachyOS LXQt Offline Workstation ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Cache CachyOS LXQt offline packages"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: cachyos-lxqt-offline-iso
  cancel-in-progress: false

jobs:
  build-amnezia:
    name: Build Amnezia from official source
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDEVENT_APIKEY: ${{ secrets.HONEYCOMB_API_KEY }}
      BUILDEVENT_DATASET: ${{ secrets.HONEYCOMB_DATASET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout custom ISO specification
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout official Amnezia source
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-client
          ref: '4.8.21.0'
          path: amnezia-src
          submodules: recursive
          fetch-depth: 1

      - name: Initialize CI observability
        shell: bash
        run: bash custom/.o11y/setup.sh

      - name: Install Qt used by upstream Linux build
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtremoteobjects qt5compat qtshadertools'
          dir: ${{ runner.temp }}
          setup-python: 'true'
          tools: 'tools_ifw'
          set-env: 'true'
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.*'

      - name: Build official Linux installer
        shell: bash
        working-directory: amnezia-src
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev p7zip-full unzip wget
          export QT_BIN_DIR="${RUNNER_TEMP}/Qt/6.10.1/gcc_64/bin"
          export QIF_BIN_DIR="${RUNNER_TEMP}/Qt/Tools/QtInstallerFramework/4.7/bin"
          ../custom/.o11y/run-step.sh amnezia-build -- bash deploy/build_linux.sh
          test -s deploy/AmneziaVPN_Linux_Installer.bin

      - name: Upload source-built Amnezia installer
        uses: actions/upload-artifact@v4
        with:
          name: amnezia-linux-source-built
          path: amnezia-src/deploy/AmneziaVPN_Linux_Installer.bin
          if-no-files-found: error
          retention-days: 7

      - name: Report Amnezia build failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          PY=python
          if [ -x custom/.o11y/.venv/bin/python ]; then PY=custom/.o11y/.venv/bin/python; fi
          "$PY" custom/.o11y/report_failure.py --job build-amnezia

      - name: Finalize Amnezia observability
        if: always()
        continue-on-error: true
        shell: bash
        run: bash custom/.o11y/finalize.sh "${{ job.status }}"

      - name: Upload Amnezia diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o11y-amnezia-${{ github.run_id }}
          path: custom/.o11y/runtime/
          if-no-files-found: ignore
          retention-days: 14

  build-iso:
    name: Build offline ISO
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: build-amnezia
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: archlinux:base-devel
      options: --privileged
    env:
      BUILDEVENT_APIKEY: ${{ secrets.HONEYCOMB_API_KEY }}
      BUILDEVENT_DATASET: ${{ secrets.HONEYCOMB_DATASET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout custom ISO specification
        uses: actions/checkout@v4

      - name: Bootstrap manifest tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python python-yaml curl jq git sudo

      - name: Initialize CI observability
        shell: bash
        run: bash .o11y/setup.sh

      - name: Recreate current install target manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect-installer-packages.py
          echo "Explicit repo-backed install targets: $(wc -l < out/top-level-packages.txt)"

      - name: Restore exact verified CachyOS package cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-${{ github.event.workflow_run.head_sha || github.sha }}
          fail-on-cache-miss: true

      - name: Verify restored package cache
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find .cache/pacman/pkg -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          test -s .cache/pacman/pkg/cachyos-lxqt-offline.db.tar.zst

      - name: Download source-built Amnezia installer
        uses: actions/download-artifact@v4
        with:
          name: amnezia-linux-source-built
          path: external/amnezia

      - name: Bootstrap CachyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -S --noconfirm --needed \
            archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub \
            gnupg unzip libarchive
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Build and verify all external offline packages
        shell: bash
        run: |
          set -euo pipefail
          AMNEZIA_INSTALLER=$(find external/amnezia -type f -name 'AmneziaVPN_Linux_Installer.bin' -print -quit)
          test -n "$AMNEZIA_INSTALLER"
          .o11y/run-step.sh external-packages -- \
            bash scripts/build-external-packages.sh external/packages "$AMNEZIA_INSTALLER"
          cp external/packages/*.pkg.tar.zst .cache/pacman/pkg/
          rm -f .cache/pacman/pkg/cachyos-lxqt-offline.db* .cache/pacman/pkg/cachyos-lxqt-offline.files*
          repo-add .cache/pacman/pkg/cachyos-lxqt-offline.db.tar.zst .cache/pacman/pkg/*.pkg.tar.zst
          (cd .cache/pacman/pkg && sha256sum -- *.pkg.tar.zst | sort -k2 > SHA256SUMS)

      - name: Prove full requested package graph resolves with zero network repos
        shell: bash
        run: |
          set -euo pipefail
          CACHE=$(realpath .cache/pacman/pkg)
          cat > /tmp/pacman-offline.conf <<EOF
          [options]
          Architecture = x86_64 x86_64_v2 x86_64_v3 x86_64_v4
          SigLevel = Never
          CacheDir = $CACHE
          [cachyos-offline]
          SigLevel = Never
          Server = file://$CACHE
          EOF
          rm -rf /tmp/offline-db
          mkdir -p /tmp/offline-db/local /tmp/offline-db/sync
          pacman --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Sy --noconfirm
          mapfile -t packages < out/top-level-packages.txt
          packages+=(windscribe sing-box xray-offline visual-studio-code-offline tor-browser-offline amnezia-vpn-offline)
          .o11y/run-step.sh offline-resolution -- \
            pacman --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db \
              -Sp --noconfirm "${packages[@]}" > out/offline-resolution-urls.txt
          echo "Offline package graph resolves: ${#packages[@]} explicit targets"

      - name: Clone official CachyOS live ISO source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CachyOS/CachyOS-Live-ISO.git cachyos-live
          git -C cachyos-live rev-parse HEAD | tee out/cachyos-live-iso-commit.txt

      - name: Inject local repository and zero-network Calamares configuration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-offline-profile.py \
            cachyos-live/archiso .cache/pacman/pkg out/top-level-packages.txt
          grep -q 'default: LXQT-Desktop' cachyos-live/archiso/airootfs/etc/calamares/modules/packagechooser_desktop.conf
          ! grep -q 'pacman -Sy' cachyos-live/archiso/airootfs/usr/local/bin/calamares-online.sh
          ! grep -q 'internet' cachyos-live/archiso/airootfs/etc/calamares/modules/welcome_online.conf

      - name: Build custom ISO
        shell: bash
        working-directory: cachyos-live
        run: |
          set -euo pipefail
          chmod -R a+rwX .
          ../.o11y/run-step.sh mkarchiso -- sudo -H -E -u builder ./buildiso.sh -p desktop -v -w

      - name: Verify ISO contains the offline repository
        shell: bash
        run: |
          set -euo pipefail
          ISO=$(find cachyos-live/out -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          sha256sum "$ISO" | tee out/ISO-SHA256SUMS
          test -s .cache/pacman/pkg/cachyos-lxqt-offline.db.tar.zst
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          du -h "$ISO" | tee out/iso-size.txt

      - name: Report ISO build failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          PY=python
          if [ -x .o11y/.venv/bin/python ]; then PY=.o11y/.venv/bin/python; fi
          "$PY" .o11y/report_failure.py --job build-iso

      - name: Finalize ISO observability
        if: always()
        continue-on-error: true
        shell: bash
        run: bash .o11y/finalize.sh "${{ job.status }}"

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o11y-iso-${{ github.run_id }}
          path: .o11y/runtime/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload ISO and provenance manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-lxqt-v4-offline-workstation
          path: |
            ${{ env.ISO }}
            out/
            external/packages/EXTERNAL-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  failure-diagnostics:
    name: Collect failure diagnostics on a fresh runner
    if: ${{ always() && (needs.build-amnezia.result == 'failure' || needs.build-amnezia.result == 'cancelled' || needs.build-iso.result == 'failure' || needs.build-iso.result == 'cancelled') }}
    needs: [build-amnezia, build-iso]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDEVENT_APIKEY: ${{ secrets.HONEYCOMB_API_KEY }}
      BUILDEVENT_DATASET: ${{ secrets.HONEYCOMB_DATASET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout observability tooling
        uses: actions/checkout@v4

      - name: Initialize fresh-runner observability
        shell: bash
        run: bash .o11y/setup.sh

      - name: Recover logs from failed or cancelled jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .o11y/runtime
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            -o .o11y/runtime/jobs.json

          jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .name] | @tsv' \
            .o11y/runtime/jobs.json > .o11y/runtime/failed-jobs.tsv

          while IFS=$'\t' read -r job_id job_name; do
            [ -n "$job_id" ] || continue
            safe_name=$(printf '%s' "$job_name" | tr -cs 'A-Za-z0-9_.-' '_')
            tmp=$(mktemp)
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/actions/jobs/${job_id}/logs" -o "$tmp"; then
              if unzip -t "$tmp" >/dev/null 2>&1; then
                unzip -p "$tmp" > ".o11y/runtime/${safe_name}.log"
              else
                mv "$tmp" ".o11y/runtime/${safe_name}.log"
              fi
            else
              printf 'unable to recover GitHub log for job %s (%s)\n' "$job_name" "$job_id" \
                > ".o11y/runtime/${safe_name}.log"
              rm -f "$tmp"
            fi
          done < .o11y/runtime/failed-jobs.tsv

          classification=workflow_failure
          if grep -Eiq 'runner has received a shutdown signal|exit code 143|SIGTERM' .o11y/runtime/*.log 2>/dev/null; then
            classification=runner_shutdown
          elif grep -Eiq 'exit code 137|out of memory|oom-kill|killed process' .o11y/runtime/*.log 2>/dev/null; then
            classification=out_of_memory
          elif grep -Eiq 'no space left on device' .o11y/runtime/*.log 2>/dev/null; then
            classification=disk_exhaustion
          elif grep -Eiq 'timed out|timeout' .o11y/runtime/*.log 2>/dev/null; then
            classification=timeout
          fi
          printf '%s\n' "$classification" | tee .o11y/runtime/failure-classification.log

      - name: Report recovered failure to Sentry
        continue-on-error: true
        shell: bash
        run: |
          PY=python
          if [ -x .o11y/.venv/bin/python ]; then PY=.o11y/.venv/bin/python; fi
          "$PY" .o11y/report_failure.py --job recovered-workflow-failure

      - name: Finalize recovered Honeycomb trace
        if: always()
        continue-on-error: true
        shell: bash
        run: bash .o11y/finalize.sh failure

      - name: Upload recovered diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o11y-recovered-${{ github.run_id }}-${{ github.run_attempt }}
          path: .o11y/runtime/
          if-no-files-found: error
          retention-days: 14
