name: Build CachyOS LXQt Offline Workstation ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-offline-iso.yml'
      - 'scripts/build-external-packages.sh'
      - 'scripts/prepare-offline-profile.py'

permissions:
  contents: read

jobs:
  build-amnezia:
    name: Build Amnezia from official source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout official Amnezia source
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-client
          ref: '4.8.21.0'
          submodules: recursive
          fetch-depth: 1

      - name: Install Qt used by upstream Linux build
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtremoteobjects qt5compat qtshadertools'
          tools: 'tools_ifw'
          setup-python: 'true'
          set-env: 'true'

      - name: Build official Linux installer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev ninja-build
          python -m pip install 'conan==2.28.0'
          deploy/build.sh --generator Ninja --installer all
          test -n "$(find deploy/build -maxdepth 1 -name 'AmneziaVPN_*_linux_x64.run' -print -quit)"

      - name: Upload source-built Amnezia installer
        uses: actions/upload-artifact@v4
        with:
          name: amnezia-linux-source-built
          path: deploy/build/AmneziaVPN_*_linux_x64.run
          if-no-files-found: error
          retention-days: 7

  build-iso:
    name: Build offline ISO
    needs: build-amnezia
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout custom ISO specification
        uses: actions/checkout@v4

      - name: Restore verified expanded CachyOS package cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-iso-${{ github.sha }}
          restore-keys: |
            cachyos-lxqt-v4-

      - name: Download source-built Amnezia installer
        uses: actions/download-artifact@v4
        with:
          name: amnezia-linux-source-built
          path: external/amnezia

      - name: Bootstrap CachyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub \
            git curl jq gnupg unzip libarchive sudo python python-yaml
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          test -n "$(find .cache/pacman/pkg -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"

      - name: Recreate current install target manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect-installer-packages.py
          echo "Explicit repo-backed install targets: $(wc -l < out/top-level-packages.txt)"

      - name: Build and verify all external offline packages
        shell: bash
        run: |
          set -euo pipefail
          AMNEZIA_RUN=$(find external/amnezia -type f -name '*.run' -print -quit)
          test -n "$AMNEZIA_RUN"
          bash scripts/build-external-packages.sh external/packages "$AMNEZIA_RUN"
          cp external/packages/*.pkg.tar.zst .cache/pacman/pkg/
          rm -f .cache/pacman/pkg/cachyos-lxqt-offline.db* .cache/pacman/pkg/cachyos-lxqt-offline.files*
          repo-add .cache/pacman/pkg/cachyos-lxqt-offline.db.tar.zst .cache/pacman/pkg/*.pkg.tar.zst
          (cd .cache/pacman/pkg && sha256sum -- *.pkg.tar.zst | sort -k2 > SHA256SUMS)

      - name: Prove the full requested package graph resolves with zero network repos
        shell: bash
        run: |
          set -euo pipefail
          CACHE=$(realpath .cache/pacman/pkg)
          cat > /tmp/pacman-offline.conf <<EOF
          [options]
          Architecture = x86_64 x86_64_v2 x86_64_v3 x86_64_v4
          SigLevel = Never
          CacheDir = $CACHE
          [cachyos-offline]
          SigLevel = Never
          Server = file://$CACHE
          EOF
          rm -rf /tmp/offline-db
          mkdir -p /tmp/offline-db/local /tmp/offline-db/sync
          pacman --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Sy --noconfirm
          mapfile -t packages < out/top-level-packages.txt
          packages+=(windscribe sing-box xray-offline visual-studio-code-offline tor-browser-offline amnezia-vpn-offline)
          pacman --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Sp --noconfirm "${packages[@]}" > out/offline-resolution-urls.txt
          echo "Offline package graph resolves: ${#packages[@]} explicit targets"

      - name: Clone official CachyOS live ISO source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CachyOS/CachyOS-Live-ISO.git cachyos-live
          git -C cachyos-live rev-parse HEAD | tee out/cachyos-live-iso-commit.txt

      - name: Inject local repository and zero-network Calamares configuration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-offline-profile.py \
            cachyos-live/archiso .cache/pacman/pkg out/top-level-packages.txt
          grep -q 'default: LXQT-Desktop' cachyos-live/archiso/airootfs/etc/calamares/modules/packagechooser_desktop.conf
          ! grep -q 'pacman -Sy' cachyos-live/archiso/airootfs/usr/local/bin/calamares-online.sh
          ! grep -q 'internet' cachyos-live/archiso/airootfs/etc/calamares/modules/welcome_online.conf

      - name: Build custom ISO
        shell: bash
        working-directory: cachyos-live
        run: |
          set -euo pipefail
          chmod -R a+rwX .
          sudo -H -E -u builder ./buildiso.sh -p desktop -v -w

      - name: Verify ISO contains the offline repository
        shell: bash
        run: |
          set -euo pipefail
          ISO=$(find cachyos-live/out -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          sha256sum "$ISO" | tee out/ISO-SHA256SUMS
          find cachyos-live/work -type f -name 'airootfs.sfs' -o -name '*.sfs' | head -n 1 > /tmp/sfs-path || true
          test -s .cache/pacman/pkg/cachyos-lxqt-offline.db.tar.zst
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          du -h "$ISO" | tee out/iso-size.txt

      - name: Upload ISO and provenance manifests
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-lxqt-v4-offline-workstation
          path: |
            ${{ env.ISO }}
            out/
            external/packages/EXTERNAL-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
