name: Cache CachyOS LXQt offline packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-offline-packages.yml'
      - 'manifests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_DIR: .cache/pacman/pkg
  DB_DIR: .cache/pacman/db

jobs:
  cache-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Bootstrap Arch tools and CachyOS v4 repositories
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed curl python python-yaml git sudo
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47

          # These are the current bootstrap packages documented by CachyOS.
          # We deliberately do not install the CachyOS pacman fork here: the
          # stock Arch pacman is enough to resolve/download the ISO package set,
          # and avoids host-runner CPU auto-detection and container hook issues.
          pacman -U --noconfirm \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-keyring-20240331-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-mirrorlist-27-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-v3-mirrorlist-27-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-v4-mirrorlist-27-1-any.pkg.tar.zst

          python scripts/force-cachyos-v4.py /etc/pacman.conf
          # CachyOS's live installer enables multilib; it is required by Steam,
          # Wine and the 32-bit NVIDIA/Vulkan packages in the offline closure.
          sed -i '/^#\[multilib\]$/,+1 s/^#//' /etc/pacman.conf
          grep -A1 -E '^\[cachyos-(v4|core-v4|extra-v4)\]$' /etc/pacman.conf
          grep -A1 -E '^\[cachyos\]$' /etc/pacman.conf
          grep -A1 -E '^\[multilib\]$' /etc/pacman.conf
          test -f /etc/pacman.d/cachyos-v4-mirrorlist
          pacman -Syy --noconfirm

      - name: Derive current installer package manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect-installer-packages.py
          echo "Top-level package/group entries: $(wc -l < out/top-level-packages.txt)"

      - name: Restore matching package cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-${{ hashFiles('out/source-manifest.json', 'out/top-level-packages.txt') }}
          restore-keys: |
            cachyos-lxqt-v4-

      - name: Resolve full dependency closure against an empty target database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR" "$DB_DIR/local" "$DB_DIR/sync"
          pacman -Sy --noconfirm --dbpath "$DB_DIR"
          mapfile -t packages < out/top-level-packages.txt
          pacman -Sp --noconfirm --dbpath "$DB_DIR" \
            --print-format '%n\t%v\t%r\t%s\t%l' \
            "${packages[@]}" | sort -u > out/resolved-packages.tsv
          echo "Resolved package records: $(wc -l < out/resolved-packages.tsv)"

      - name: Download complete package closure
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < out/top-level-packages.txt
          pacman -Sw --noconfirm --dbpath "$DB_DIR" \
            --cachedir "$CACHE_DIR" \
            "${packages[@]}"

      - name: Build local offline repository metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_files=("$CACHE_DIR"/*.pkg.tar.zst)
          if (( ${#package_files[@]} == 0 )); then
            echo 'No package payloads were downloaded' >&2
            exit 1
          fi
          rm -f "$CACHE_DIR"/cachyos-lxqt-offline.db* \
                "$CACHE_DIR"/cachyos-lxqt-offline.files*
          repo-add "$CACHE_DIR/cachyos-lxqt-offline.db.tar.zst" "${package_files[@]}"
          (
            cd "$CACHE_DIR"
            sha256sum -- *.pkg.tar.zst | sort -k2 > SHA256SUMS
          )
          {
            echo "package_files=${#package_files[@]}"
            echo "cache_bytes=$(du -sb "$CACHE_DIR" | cut -f1)"
            echo "cache_human=$(du -sh "$CACHE_DIR" | cut -f1)"
          } | tee out/cache-summary.txt

      - name: Save package cache for later ISO job
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-${{ hashFiles('out/source-manifest.json', 'out/top-level-packages.txt') }}

      - name: Upload review manifests only
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-lxqt-package-manifests-v4
          path: out/
          if-no-files-found: error
          retention-days: 14
