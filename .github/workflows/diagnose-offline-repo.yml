name: Diagnose CachyOS offline repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-offline-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-offline-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    steps:
      - name: Restore exact cache from failed ISO run
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-e20499f7308fca75659a6e17f6b0e0f2b77cbf39
          fail-on-cache-miss: true

      - name: Isolate repo-add local sync behavior
        shell: bash
        run: |
          set -euo pipefail
          CACHE=$(realpath .cache/pacman/pkg)
          DB=cachyos-lxqt-offline
          DBFILE="$CACHE/$DB.db.tar.zst"

          cat > /tmp/pacman-offline.conf <<EOF
          [options]
          Architecture = x86_64 x86_64_v2 x86_64_v3 x86_64_v4
          SigLevel = Never
          CacheDir = $CACHE
          [$DB]
          SigLevel = Never
          Server = file://$CACHE
          EOF

          inspect() {
            local label=$1
            echo "=== $label ==="
            date -u '+runner_now=%Y-%m-%dT%H:%M:%SZ epoch=%s'
            env | grep -E '^(SOURCE_DATE_EPOCH|BUILD)' || true
            ls -l "$CACHE/$DB.db" "$DBFILE" || true
            stat -c '%A %U:%G size=%s mtime=%y epoch=%Y %n' "$CACHE/$DB.db" "$DBFILE" || true
            stat -Lc '%A %U:%G size=%s mtime=%y epoch=%Y %n' "$CACHE/$DB.db" || true
          }

          sync_case() {
            local label=$1
            shift
            rm -rf /tmp/offline-db
            mkdir -p /tmp/offline-db/local /tmp/offline-db/sync
            set +e
            pacman --debug --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db "$@" --noconfirm 2>&1 | tee "/tmp/$label.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$label exit=$rc"
            return "$rc"
          }

          inspect pristine
          sync_case pristine-sync -Sy

          cp -a "$CACHE/$DB.db" /tmp/pristine.db.link
          cp -a "$DBFILE" /tmp/pristine.db.tar.zst

          echo '=== rebuild only from the already-cached package payloads ==='
          rm -f "$CACHE/$DB.db"* "$CACHE/$DB.files"*
          repo-add "$DBFILE" "$CACHE"/*.pkg.tar.zst
          inspect rebuilt

          rebuilt_rc=0
          sync_case rebuilt-sync -Sy || rebuilt_rc=$?

          echo '=== force refresh rebuilt database ==='
          force_rc=0
          sync_case rebuilt-force-sync -Syy || force_rc=$?

          echo '=== normalize outer database timestamps to current runner time ==='
          touch "$DBFILE"
          touch -h "$CACHE/$DB.db"
          inspect touched
          touch_rc=0
          sync_case touched-sync -Sy || touch_rc=$?

          echo '=== copy database directly into sync dbpath (no file transfer) ==='
          rm -rf /tmp/offline-db
          mkdir -p /tmp/offline-db/local /tmp/offline-db/sync
          cp "$DBFILE" "/tmp/offline-db/sync/$DB.db"
          pacman --debug --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Sl "$DB" >/tmp/direct-list.txt
          echo "direct_parse=success packages=$(wc -l < /tmp/direct-list.txt)"

          echo "RESULT rebuilt=$rebuilt_rc force=$force_rc touched=$touch_rc"
          if (( touched_rc != 0 )); then
            exit "$touched_rc"
          fi
