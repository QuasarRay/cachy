name: Diagnose CachyOS offline repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-offline-repo.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-offline-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout failing source revision
        uses: actions/checkout@v4
        with:
          ref: e20499f7308fca75659a6e17f6b0e0f2b77cbf39

      - name: Restore exact cache from failed ISO run
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: cachyos-lxqt-v4-e20499f7308fca75659a6e17f6b0e0f2b77cbf39
          fail-on-cache-miss: true

      - name: Download exact Amnezia artifact from failed ISO run
        uses: actions/download-artifact@v4
        with:
          name: amnezia-linux-source-built
          path: external/amnezia
          github-token: ${{ github.token }}
          repository: QuasarRay/cachy
          run-id: '31567267435'

      - name: Install diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed curl jq sudo gnupg unzip libarchive python python-yaml
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Prove combined production fix
        shell: bash
        run: |
          set -euo pipefail
          CACHE=$(realpath .cache/pacman/pkg)
          DB=cachyos-lxqt-offline
          AMNEZIA_INSTALLER=$(find external/amnezia -type f -name 'AmneziaVPN_Linux_Installer.bin' -print -quit)
          test -n "$AMNEZIA_INSTALLER"

          bash scripts/build-external-packages.sh external/packages "$AMNEZIA_INSTALLER"
          cp external/packages/*.pkg.tar.zst "$CACHE/"
          rm -f "$CACHE/$DB.db"* "$CACHE/$DB.files"*
          repo-add "$CACHE/$DB.db.tar.zst" "$CACHE"/*.pkg.tar.zst

          # repo-add can inherit a future package mtime into its generated database.
          # Pacman's file:// transfer then rejects the DB as "expected download size exceeded".
          # Normalize the generated repo metadata to this runner's current time.
          touch "$CACHE/$DB.db.tar.zst" "$CACHE/$DB.files.tar.zst"
          touch -h "$CACHE/$DB.db" "$CACHE/$DB.files"

          cat > /tmp/pacman-offline.conf <<EOF
          [options]
          Architecture = x86_64 x86_64_v2 x86_64_v3 x86_64_v4
          SigLevel = Never
          CacheDir = $CACHE
          [$DB]
          SigLevel = Never
          Server = file://$CACHE
          EOF

          rm -rf /tmp/offline-db
          mkdir -p /tmp/offline-db/local /tmp/offline-db/sync
          pacman --debug --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Sy --noconfirm

          python scripts/collect-installer-packages.py
          mapfile -t packages < out/top-level-packages.txt
          packages+=(windscribe-cli sing-box xray-offline visual-studio-code-offline tor-browser-offline amnezia-vpn-offline)

          pacman --debug --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db \
            -Sp --noconfirm "${packages[@]}" > /tmp/offline-resolution.txt
          test -s /tmp/offline-resolution.txt

          pacman --config /tmp/pacman-offline.conf --dbpath /tmp/offline-db -Si windscribe-cli >/tmp/windscribe.txt
          grep -q '^Name            : windscribe-cli$' /tmp/windscribe.txt

          echo "combined_fix=success explicit_targets=${#packages[@]} resolution_lines=$(wc -l < /tmp/offline-resolution.txt)"
