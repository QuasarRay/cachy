name: Export Verified CachyOS Offline Repository

on:
  push:
    branches: [agent/iso-build-run]
    paths:
      - '.github/workflows/export-verified-offline-repo.yml'
      - 'pipeline/tools/verify_cache_against_syncdb.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: export-verified-cachyos-offline-repo
  cancel-in-progress: false

env:
  CACHE_DIR: .cache/pacman/pkg
  DB_DIR: .cache/pacman/db
  EXPECTED_PACKAGE_COUNT: '1726'
  EXPECTED_CACHE_KEY: cachyos-lxqt-v4-47180113d766196dbf20615d2fb7c3098a49393faf61ca3b219a0836f0cd4a38
  SOURCE_RESOLUTION_RUN_ID: '31613260980'
  SOURCE_RESOLUTION_ARTIFACT: cachyos-lxqt-package-manifests-v4-31613260980
  EXPORT_TAR: cachyos-lxqt-offline-repo-verified-1726.tar

jobs:
  verify-and-export:
    name: Verify cached bytes against original repository hashes and export
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base

    steps:
      - name: Check out export tooling
        uses: actions/checkout@v4

      - name: Install baseline verification tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed python libarchive coreutils tar
          python --version
          bsdtar --version
          sha256sum --version | head -n 1
          tar --version | head -n 1

      - name: Download original Pacman resolution manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_RESOLUTION_ARTIFACT }}
          path: original-resolution
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RESOLUTION_RUN_ID }}

      - name: Validate original resolution manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test -s original-resolution/resolved-packages.tsv
          resolved_count=$(wc -l < original-resolution/resolved-packages.tsv)
          test "$resolved_count" -eq "$EXPECTED_PACKAGE_COUNT"
          echo "Original Pacman resolution records: $resolved_count"
          sha256sum original-resolution/resolved-packages.tsv

      - name: Restore exact 5.4 GB package checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/pacman/pkg
            .cache/pacman/db
          key: ${{ env.EXPECTED_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify checkpoint's post-download checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CACHE_DIR/SHA256SUMS"
          test -s "$CACHE_DIR/cachyos-lxqt-offline.db.tar.zst"
          package_count=$(find "$CACHE_DIR" -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)
          test "$package_count" -eq "$EXPECTED_PACKAGE_COUNT"
          (
            cd "$CACHE_DIR"
            sha256sum --strict --quiet -c SHA256SUMS
          )
          echo "Existing checkpoint manifest verifies all $package_count cached package files"

      - name: Compare every cached package hash with its originally selected repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export downloadable
          mkdir -p export/cachyos-lxqt-offline-repo export/verification-source/pacman-sync-db

          python pipeline/tools/verify_cache_against_syncdb.py \
            --cache-dir "$CACHE_DIR" \
            --db-dir "$DB_DIR" \
            --resolved-packages original-resolution/resolved-packages.tsv \
            --expected-count "$EXPECTED_PACKAGE_COUNT" \
            --upstream-sums export/cachyos-lxqt-offline-repo/UPSTREAM-SHA256SUMS \
            --report-json export/VERIFICATION.json

          # Hard-link the already-verified repository payloads into the export tree so
          # staging does not consume another ~5.4 GiB before the portable tar is made.
          cp -al "$CACHE_DIR"/. export/cachyos-lxqt-offline-repo/
          cp -a "$DB_DIR"/sync/*.db export/verification-source/pacman-sync-db/
          cp -a original-resolution/resolved-packages.tsv export/verification-source/

          # Re-run the authoritative manifest against the exact export tree.
          (
            cd export/cachyos-lxqt-offline-repo
            sha256sum --strict --quiet -c UPSTREAM-SHA256SUMS
          )

          cat > export/README.txt <<'EOF'
          CachyOS LXQt offline package repository
          =======================================

          This archive contains the exact 1,726-package checkpoint used by the
          custom CachyOS ISO work.

          Integrity evidence:
          - verification-source/resolved-packages.tsv is the original 1,726-line
            Pacman resolution manifest from cache workflow run 31613260980. It
            identifies the exact repository and URL selected for every package.
          - cachyos-lxqt-offline-repo/UPSTREAM-SHA256SUMS contains the SHA-256
            from that selected repository's saved Pacman sync metadata for each
            package, not a hash generated from the cache itself.
          - VERIFICATION.json records every package/repository/hash comparison and
            hashes of the resolution manifest and saved sync databases.
          - verification-source/pacman-sync-db/ contains those saved sync DBs.
          - cachyos-lxqt-offline-repo/SHA256SUMS is the separate post-download
            checkpoint manifest generated when the cache was first created.

          To re-check after extracting:
            cd cachyos-lxqt-offline-repo
            sha256sum -c UPSTREAM-SHA256SUMS

          For manual Pacman use, point a repository stanza at the absolute path:
            [cachyos-lxqt-offline]
            SigLevel = Optional TrustAll
            Server = file:///ABSOLUTE/PATH/TO/cachyos-lxqt-offline-repo

          The six separately-built external packages are not part of this
          1,726-package base checkpoint.
          EOF

          {
            echo "package_count=$(find export/cachyos-lxqt-offline-repo -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)"
            echo "repository_bytes=$(du -sb export/cachyos-lxqt-offline-repo | cut -f1)"
            echo "cache_key=$EXPECTED_CACHE_KEY"
            echo "source_resolution_run=$SOURCE_RESOLUTION_RUN_ID"
            echo "verification=all cached package SHA-256 values match the saved metadata of the exact repositories selected by the original Pacman resolution"
          } | tee export/EXPORT-SUMMARY.txt

      - name: Create portable tar preserving Arch package filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloadable
          tar -cf "downloadable/$EXPORT_TAR" -C export .
          sha256sum "downloadable/$EXPORT_TAR" > "downloadable/$EXPORT_TAR.sha256"
          test -s "downloadable/$EXPORT_TAR"
          cat "downloadable/$EXPORT_TAR.sha256"
          du -h "downloadable/$EXPORT_TAR"

      - name: Upload verified offline repository tar
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-lxqt-offline-repo-verified-1726
          path: downloadable/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Record downloadable artifact identity
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
          echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
