name: Test Hardened ISO Validator

on:
  push:
    branches: [agent/pipeline-hardening]
    paths:
      - '.github/workflows/test-hardened-iso-validator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-historical-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: '31601029698'

    steps:
      - name: Checkout hardened validator
        uses: actions/checkout@v4

      - name: Download previous real ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: cachyos-lxqt-v4-offline-workstation
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install userspace artifact inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools zstd libarchive-tools
          df -h /

      - name: Validate previous finished ISO without loop devices
        shell: bash
        run: |
          set -euo pipefail
          ISO=$(find candidate -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          mkdir -p verified
          sha256sum "$ISO" | tee verified/ISO-SHA256SUMS
          du -h "$ISO" | tee verified/iso-size.txt
          bash scripts/verify-offline-iso.sh "$ISO" \
            > >(tee verified/offline-iso-validation.log) \
            2> >(tee verified/offline-iso-validation.stderr >&2)

      - name: Upload validator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardened-validator-evidence-${{ github.run_id }}
          path: verified/
          if-no-files-found: ignore
          retention-days: 14
