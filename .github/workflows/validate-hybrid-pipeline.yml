name: Validate hybrid Dagger pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/validate-hybrid-pipeline.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/validate-hybrid-pipeline.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and boundary validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate through Dagger
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: '0.21.8'
          verb: call
          module: ./pipeline
          args: check-contracts --source=.

      - name: Resolve real CachyOS live ISO source through SourceLock producer
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: '0.21.8'
          verb: call
          module: ./pipeline
          args: >-
            lock-git-source
            --source-name=cachyos-live-iso
            --retrieval-uri=https://github.com/CachyOS/CachyOS-Live-ISO.git
            --requested-ref=master

      - name: Resolve real CachyOS v4 PackageClosure from locked Calamares source
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: '0.21.8'
          verb: call
          module: ./pipeline
          args: check-current-package-resolution --source=.
