name: Verify six offline package payloads

on:
  push:
    branches:
      - agent/verify-six-package-provenance
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact verification branch
        uses: actions/checkout@v4

      - name: Download exact six-package checkpoint
        uses: actions/download-artifact@v4
        with:
          name: external-offline-packages-baseline-clean
          path: checkpoint
          github-token: ${{ github.token }}
          run-id: 31616472561

      - name: Download exact Amnezia source-build checkpoint
        uses: actions/download-artifact@v4
        with:
          name: amnezia-linux-source-built-locked
          path: amnezia-source
          github-token: ${{ github.token }}
          run-id: 31614038706

      - name: Install independent verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools jq gnupg xz-utils zstd unzip diffutils \
            rpm rpm2cpio cpio file curl python3

      - name: Directly verify Amnezia source-build preservation
        run: |
          set -euo pipefail
          mkdir -p evidence /tmp/amnezia-check
          src=$(find amnezia-source -type f -name 'AmneziaVPN_Linux_Installer.bin' -print -quit)
          test -n "$src"
          expected_src=b5bc3ad218e4c8ac2c92ddbcc7e057837330a59f2594e6bf06fccbe446b2fc48
          actual_src=$(sha256sum "$src" | awk '{print $1}')
          test "$actual_src" = "$expected_src"
          pkg=''
          while IFS= read -r p; do
            name=$(bsdtar -xOf "$p" .PKGINFO | sed -n 's/^pkgname = //p' | head -n1)
            if [ "$name" = amnezia-vpn-offline ]; then pkg="$p"; break; fi
          done < <(find checkpoint -type f -name '*.pkg.tar.zst' | sort)
          test -n "$pkg"
          member=$(bsdtar -tf "$pkg" | grep -E '^\.?/?usr/lib/amnezia-offline/AmneziaVPN\.run$' | head -n1)
          test -n "$member"
          bsdtar -xOf "$pkg" "$member" > /tmp/amnezia-check/packaged.run
          packaged_sha=$(sha256sum /tmp/amnezia-check/packaged.run | awk '{print $1}')
          cmp -s "$src" /tmp/amnezia-check/packaged.run
          cat > evidence/amnezia-preservation.txt <<EOF
          producer_installer_sha256=$actual_src
          packaged_installer_sha256=$packaged_sha
          byte_identical=true
          package=$(basename "$pkg")
          EOF
          cat evidence/amnezia-preservation.txt

      - name: Verify official Amnezia Linux release artifact digest
        run: |
          set -euo pipefail
          url='https://github.com/amnezia-vpn/amnezia-client/releases/download/4.8.21.0/AmneziaVPN_4.8.21.0_linux_x64.tar'
          expected='bc214d824fc5a607b27f11a8a0c0f417657d03adba65d09f142244215842a7df'
          curl -fL --retry 5 --retry-all-errors "$url" -o /tmp/amnezia-official.tar
          actual=$(sha256sum /tmp/amnezia-official.tar | awk '{print $1}')
          test "$actual" = "$expected"
          {
            echo "official_tar_sha256=$actual"
            echo "official_tar_size=$(stat -c %s /tmp/amnezia-official.tar)"
            echo "official_tar_digest_match=true"
            echo 'members:'
            tar -tf /tmp/amnezia-official.tar
          } > evidence/amnezia-official-release.txt
          head -n 20 evidence/amnezia-official-release.txt

      - name: Correct verifier trust-check mechanics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pipeline/tools/verify_six_package_provenance.py')
          s = p.read_text()
          old = '''    if not rel.get("immutable", False):\n        raise RuntimeError(f"GitHub release {repo}@{tag} is not immutable")\n'''
          if old not in s:
              raise SystemExit('GitHub immutable guard not found')
          s = s.replace(old, '')
          s = s.replace('"release_immutable": True,', '"release_immutable": bool(rel.get("immutable", False)),')
          old = 'sig = run(["rpmkeys", "--checksig", "--verbose", str(dest)], check=False)'
          new = 'sig = run(["sudo", "rpmkeys", "--checksig", "--verbose", str(dest)], check=False)'
          if old not in s:
              raise SystemExit('rpmkeys call not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Verify all six package provenance chains
        id: verify
        continue-on-error: true
        env:
          CHECKPOINT_DIR: ${{ github.workspace }}/checkpoint
          AMNEZIA_SOURCE_DIR: ${{ github.workspace }}/amnezia-source
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          set -euo pipefail
          amnezia_bin=$(find "$AMNEZIA_SOURCE_DIR" -type f -name 'AmneziaVPN_Linux_Installer.bin' -print -quit)
          test -n "$amnezia_bin"
          ln -f "$amnezia_bin" "$AMNEZIA_SOURCE_DIR/AmneziaVPN.run"
          python3 pipeline/tools/verify_six_package_provenance.py

      - name: Print detailed evidence
        if: always()
        run: |
          test -f evidence/report.json && cat evidence/report.json || true
          test -f evidence/amnezia-preservation.txt && cat evidence/amnezia-preservation.txt || true

      - name: Upload verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-six-package-provenance-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce expected verification result
        if: always()
        run: |
          cat evidence/report.txt
          grep -q '^byte_identical=true$' evidence/amnezia-preservation.txt
